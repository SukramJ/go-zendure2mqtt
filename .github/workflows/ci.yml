# GitHub Actions CI for go-zendure2mqtt.
#
# Jobs: lint (go vet + gofumpt + golangci-lint + go.mod tidiness),
# security (govulncheck + go-licenses + gitleaks — this repo ships release
# archives and a Docker image, so a vulnerable or copyleft dependency is an
# exposure in a distributed artifact), test (matrix across the OS triplet
# the daemon supports — race detector on, so CGo enabled for this single
# step), coverage (per-package floor), fuzz-smoke (bounded run per Fuzz
# target), build (sanity-check that both binaries link and produce a version
# banner). Concurrency cancels stale runs on the same ref so a fast-pushing
# developer isn't billed for outdated commits.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.26"
  # The lint tools are pinned, not @latest. Dependabot tracks go.mod
  # requires, not go-install lines in a workflow, so these are bumped by
  # hand — deliberately: raise the version, run `make check`, and fix or
  # justify whatever the new release finds in the same change. Floating on
  # @latest makes this gate report on the calendar rather than on the diff,
  # and turns an unrelated upstream release into a red CI on someone else's
  # PR. Keep these in step with the versions `make setup` installs.
  #
  # Note the gofumpt step runs the standalone formatter, which is stricter
  # than the one golangci-lint bundles, so both pins matter independently.
  GOFUMPT_VERSION: "v0.12.0"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  # The security tools are pinned for the same reason, with one difference
  # worth stating: pinning these binaries does not freeze the answer they
  # give. govulncheck resolves the vulnerability database at run time and
  # go-licenses classifies whatever a dependency actually ships, so a newly
  # published advisory or a relicensed dependency still turns this job red
  # without a commit here — which is exactly what it is for. The pin only
  # removes the *other* source of red: a tool release changing its own
  # reachability analysis or license classifier under an unrelated PR.
  GOVULNCHECK_VERSION: "v1.8.0"
  GOLICENSES_VERSION: "v1.6.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
          diff=$(gofumpt -l .)
          if [ -n "$diff" ]; then
            echo "::error::gofumpt would rewrite:"
            echo "$diff"
            exit 1
          fi
      # Install golangci-lint v2 from source with the Go toolchain set up
      # above. The prebuilt binary ships built with an older Go and refuses
      # to run against a module targeting a newer one, and
      # golangci-lint-action@v6 installs a v1 binary that rejects this
      # repo's v2 config (the version/formatters/linters.default keys). A
      # direct `go install` of the /v2/ module avoids both problems.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
          golangci-lint config verify
          golangci-lint run --timeout=5m ./...

  # This repo is not a library: `make release` stages cross-compiled tarballs
  # and the Dockerfile ships an image, so every dependency it links is
  # redistributed. That makes both of these gates about a shipped artifact
  # rather than about style — `make licenses` forbids GPL/AGPL/LGPL
  # (restricted) and MPL (reciprocal) against an MIT source tree, and
  # govulncheck's reachability analysis fails only when a known
  # vulnerability sits on a path this code actually calls. Both targets
  # already existed in the Makefile and ran in no job.
  security:
    name: security (vuln + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          make vuln
      - name: go-licenses
        run: |
          go install github.com/google/go-licenses@${{ env.GOLICENSES_VERSION }}
          make licenses

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        env:
          # Race detector requires CGo; re-enable just for this step.
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout=120s ./...

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build daemon + util
        run: make build
      - name: version banner
        run: ./bin/zendure2mqtt --version
